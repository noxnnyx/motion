<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서울의 아침</title>
    <meta name="description" content="월드타워와 남산이 보이는 서울을 펜으로 그려가는 30초 라인 드로잉 영상" />
    <style>
      :root {
        --paper: #f6f2e9;
        --ink: #1d1d1f;
        --soft: #5a5955;
        --accent: #c8562a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 16px;
      }
      header { text-align: center; margin-bottom: 28px; }
      h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
      h1 em { font-style: normal; color: var(--accent); }
      header p { margin-top: 10px; color: var(--soft); font-size: 16px; }
      .frame {
        width: 100%;
        max-width: 1100px;
        border: 1.5px solid var(--ink);
        padding: 8px;
        background: #fff;
      }
      video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: var(--paper); }
      footer { margin-top: 22px; color: var(--soft); font-size: 14px; text-align: center; line-height: 1.7; }
      footer a { color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1>오늘도, <em>잘 다녀오세요.</em></h1>
      <p>출근길의 당신에게 — 서울 라인 드로잉 30초</p>
    </header>
    <div class="frame">
      <video src="seoul-lineart/renders/seoul-morning.mp4" controls playsinline preload="metadata"></video>
    </div>
    <footer>
      1920×1080 · 30초 · HyperFrames로 제작<br />
      <a href="seoul-lineart/renders/seoul-morning.mp4" download>MP4 내려받기</a> ·
      <a href="https://github.com/noxnnyx/motion">소스 보기</a>
    </footer>
  </body>
</html>
