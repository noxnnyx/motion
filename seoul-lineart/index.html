<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f6f2e9;
        --ink: #1d1d1f;
        --ink-soft: #4a4a4e;
        --ink-faint: #7c7b78;
        --accent: #f08a5d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-wo3l"
        id="drawing"
        class="clip"
        data-composition-id="drawing"
        data-composition-src="compositions/drawing.html"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="message"
        class="clip"
        data-composition-id="message"
        data-composition-src="compositions/message.html"
        data-start="0"
        data-duration="30"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <audio
        id="music"
        src="assets/music/seoul-morning.wav"
        data-start="0"
        data-duration="30"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
